# Fenrir override of CachyOS's stock bootloader.conf.
#
# Identical to upstream except efiBootLoaderVar is blanked out. Upstream
# points it at a GlobalStorage key that only gets set by the
# packagechooser@bootloader page, which Fenrir's settings.conf removes from
# the install flow (Fenrir only ever installs Limine, no chooser needed).
# With efiBootLoaderVar pointing at a key that's never set, the bootloader
# module reports no bootloader selected instead of falling back to
# efiBootLoader below, so it has to be turned off here rather than just
# left unset.
---
efiBootLoaderVar: ""

# Define which bootloader you want to use for EFI installations
# Possible options are 'grub', 'sb-shim', 'systemd-boot', 'refind' or 'limine'
efiBootLoader: "limine"

# systemd-boot configuration files settings

# kernelSearchPath is the path relative to the root of the install to search for kernels
# A kernel is identified by finding files which match regular expression, kernelPattern
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"

# loaderEntries is an array of options to add to loader.conf for systemd-boot
# please note that the "default" option is added programmatically
loaderEntries:
  - "timeout 5"
  - "console-mode keep"

# systemd-boot and refind support custom kernel params
kernelParams: [ "quiet","nowatchdog" ]

# A list of kernel names that refind should accept as kernels
refindKernelList: [ "linux-cachyos-bore","linux-cachyos-lts","linux-cachyos-bmq","linux-cachyos","linux" ]

# GRUB 2 binary names and boot directory
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

efiBootloaderId: "cachyos"

installEFIFallback: true

installHybridGRUB: false

# Limine bootloader splash screen
limineSplashLogo: "/usr/share/wallpapers/cachyos-wallpapers/limine-splash.png"
