# Fenrir override of CachyOS's stock settings.conf.
#
# Same instances and exec sequence as upstream (all the actual install
# logic is unchanged), but the "show" sequence drops the bootloader chooser
# and desktop chooser pages, since Fenrir only ever ships one bootloader
# (Limine, already the hardcoded default in bootloader.conf) and one desktop
# (Hyprland + Caelestia, already baked into the live image). Netinstall is
# dropped too, for the same reason. What's left matches what was asked for:
# locale, keyboard, partitioning, and users.
---
modules-search: [ local ]

instances:

- id:       online
  module:   packages
  config:   packages_online.conf

- id:       online
  module:   welcome
  config:   welcome_online.conf

- id:       before-online
  module:   shellprocess
  config:   shellprocess-before-online.conf

- id:       modify_mk_hook
  module:   shellprocess
  config:   shellprocess_modify_mk_hook.conf

- id:       reset_mk_hook
  module:   shellprocess
  config:   shellprocess_reset_mk_hook.conf

- id:       initialize_pacman
  module:   shellprocess
  config:   shellprocess_initialize_pacman.conf

- id:       bootloader
  module:   packagechooser
  config:   packagechooser_bootloader.conf

- id:       desktop
  module:   packagechooser
  config:   packagechooser_desktop.conf

- id:       enable_ufw
  module:   shellprocess
  config:   shellprocess_enable_ufw.conf

- id:       btrfs_snapshot
  module:   shellprocess
  config:   shellprocess_btrfs_snapshot.conf

- id:       cleanup_calamares
  module:   shellprocess
  config:   shellprocess_cleanup_calamares.conf


sequence:
- show:
  - welcome@online
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - zfs
  - mount
  - shellprocess@modify_mk_hook
  - shellprocess@initialize_pacman
  - shellprocess@before-online
  - pacstrap
  - machineid
  - locale
  - keyboard
  - localecfg
  - chwd
  - packages@online
  - luksbootkeyfile
  - luksopenswaphookcfg
  - fstab
  - plymouthcfg
  - zfshostid
  - initcpiocfg
  - initcpio
  - users
  - networkcfg
  - displaymanager
  - hwclock
  - grubcfg
  - bootloader
  - shellprocess@reset_mk_hook
  - services-systemd
  - shellprocess
  - shellprocess@enable_ufw
  - shellprocess@btrfs_snapshot
  - shellprocess@cleanup_calamares
  - umount
- show:
  - finished

branding: cachyos

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: true

quit-at-end: false
