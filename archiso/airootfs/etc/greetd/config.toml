# Live-session variant of the package's /etc/greetd/config.toml, which the
# airootfs overlay replaces. initial_session autologins straight into the live
# desktop on first boot the way sddm's autologin.conf used to; log out and the
# greeter takes over. The installer replaces this whole file with the pristine
# copy from /usr/share/fenrir-greeter/, so liveuser never reaches a real
# install.
[terminal]
vt = 1

[initial_session]
command = "uwsm start -e -D Hyprland hyprland.desktop"
user = "liveuser"

[default_session]
command = "Hyprland --config /etc/greetd/hyprland.conf"
user = "greeter"
