# greetd launches a throwaway Hyprland as the unprivileged "greeter" user,
# which runs the Quickshell greeter and nothing else. Hyprland exits as soon
# as the greeter does, handing the session back to greetd.
#
# Launched through start-hyprland, Hyprland 0.56's watchdog wrapper: running
# the Hyprland binary directly puts "Hyprland was started without
# start-hyprland" on screen instead of the greeter. Everything after -- is
# passed through to Hyprland.
[terminal]
vt = 1

[default_session]
command = "start-hyprland -- --config /etc/greetd/hyprland.lua"
user = "greeter"
