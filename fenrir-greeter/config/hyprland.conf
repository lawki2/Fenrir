# Compositor for the login screen only. Deliberately bare: no bar, no
# animations, nothing that has to load before someone can type a password.
monitor = , preferred, auto, 1

# Written by the installer from the layout chosen during setup. Without it the
# greeter is always us, and anyone on another layout mistypes their password
# with no way to see why.
source = /etc/greetd/hyprland-layout.conf

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

animations {
    enabled = false
}

decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

# Quickshell owns the whole screen; when it exits, so does this Hyprland, and
# greetd starts the real session.
exec-once = quickshell -p /etc/xdg/quickshell/fenrir-greeter; hyprctl dispatch exit
